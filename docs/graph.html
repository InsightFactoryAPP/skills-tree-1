<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Tree — Dependency Graph</title>
</head>
<body>
<h1>Skills Tree — Dependency Graph</h1>
<p id="status">Loading canonical graph data…</p>
<p><a href="index.html">Back to Skills Tree</a></p>
<script type="module">
const GRAPH_URL = "./data/SKILLS_GRAPH.json";
const status = document.getElementById("status");

try {
  const response = await fetch(GRAPH_URL, { cache: "no-store" });
  if (!response.ok) throw new Error(`Graph data request failed: ${response.status}`);
  const graph = await response.json();
  if (!Array.isArray(graph.nodes) || !Array.isArray(graph.edges)) {
    throw new Error("Canonical graph schema is invalid: nodes/edges are required");
  }
  status.textContent = `Loaded canonical graph: ${graph.nodes.length} nodes, ${graph.edges.length} edges. Schema ${graph.meta?.schema_version ?? "unknown"}.`;
} catch (error) {
  status.textContent = `Unable to load canonical graph data: ${error.message}`;
  status.setAttribute("role", "alert");
}
</script>
</body>
</html>
