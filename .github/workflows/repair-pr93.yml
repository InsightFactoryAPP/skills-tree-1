name: Temporary PR 93 repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/production-hardening-20260917'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/architect.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          changed = False
          for line in lines:
              if 'REQUIRED SKILLS (sorted by score' in line and "print(f" in line and out:
                  out[-1] = '    separator = "─" * 70'
                  out.append('    print(f"\\n{separator}\\nREQUIRED SKILLS (sorted by score ↓):")')
                  changed = True
              else:
                  out.append(line)
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          assert changed, 'architect.py blocker was not found'

          p = Path('tests/test_cli.py')
          s = p.read_text(encoding='utf-8')
          assert 'runner = CliRunner(mix_stderr=False)' in s
          p.write_text(s.replace('runner = CliRunner(mix_stderr=False)', 'runner = CliRunner()', 1), encoding='utf-8')

          p = Path('skills/02-reasoning/prompt-engineering.md')
          s = p.read_text(encoding='utf-8')
          old = '''def build_prompt(task, context, constraints):
    return f"Task: {task}\\nContext: {context}\\nConstraints: {'; '.join(constraints)}"'''
          new = '''def build_prompt(task, context, constraints):
    instructions = f"Task: {task}\\nContext: {context}"
    return f"{instructions}\\nConstraints: {'; '.join(constraints)}"'''
          assert old in s
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify fixes
        run: |
          python -m py_compile tools/architect.py
          python -m pytest -q tests/test_cli.py
      - name: Commit fixes and remove workflow
        run: |
          rm .github/workflows/repair-pr93.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/architect.py tests/test_cli.py skills/02-reasoning/prompt-engineering.md .github/workflows/repair-pr93.yml
          git commit -m 'fix: clear PR 93 CI blockers'
          git push origin agent/production-hardening-20260917
